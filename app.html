<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Bill data is private and ephemeral. It must never be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Hissa</title>
    <meta name="theme-color" content="#f3ecda" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211f1b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hissa" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The body face is the only render-blocking font. -->
    <link rel="preload" href="/fonts/hissa-hand.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Paint the paper before any CSS arrives, so there is no white flash. */
      html { background: #f3ecda; }
      @media (prefers-color-scheme: dark) { html { background: #211f1b; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
